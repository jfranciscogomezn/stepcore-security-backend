spring:
  datasource:
    # Runtime connections use a dedicated, NON-owner role with no BYPASSRLS, so PostgreSQL
    # Row-Level Security is always enforced on tenant-owned tables (see migration V8).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stepcore_security}
    username: ${DB_APP_USER:stepcore_app}
    password: ${DB_APP_PASSWORD:stepcore_app_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Migrations and seeding run as the table owner (gmm_user), which bypasses RLS.
    user: ${DB_USER:gmm_user}
    password: ${DB_PASSWORD:gmm_pass}
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:stepcore-security-super-secret-key-change-in-production-min-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.stepcore.security: INFO
    org.springframework.security: WARN
